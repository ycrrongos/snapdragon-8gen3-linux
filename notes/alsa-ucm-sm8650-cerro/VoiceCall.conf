Syntax 4

# callaudiod / voice-call mode: earpiece + handset mic (Aurora voice-handset).

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' on,on"
		cset "name='SpkrLeft Profile Set' Receiver"
		cset "name='SpkrRight Profile Set' Music"
		cset "name='SpkrLeft PCM Playback Volume' 280"
		cset "name='SpkrRight PCM Playback Volume' 0"
	]

	DisableSequence [
		cset "name='SpkrLeft Profile Set' Music"
		cset "name='SpkrLeft PCM Playback Volume' 270"
		cset "name='SpkrRight PCM Playback Volume' 270"
	]

	Value {
		TQ "Voice"
	}
}

SectionDevice."Earpiece" {
	Comment "In-call earpiece"

	EnableSequence [
		cset "name='SpkrLeft Profile Set' Receiver"
		cset "name='SpkrRight PCM Playback Volume' 0"
		cset "name='SpkrLeft PCM Playback Volume' 280"
	]

	DisableSequence [
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Speaker" {
	Comment "In-call loudspeaker"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='SpkrLeft Profile Set' Music"
		cset "name='SpkrRight Profile Set' Music"
		cset "name='SpkrLeft PCM Playback Volume' 270"
		cset "name='SpkrRight PCM Playback Volume' 270"
	]

	DisableSequence [
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Mic" {
	Comment "In-call handset mic (Aurora amic1)"

	EnableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' on"
		cset "name='TX_AIF1_CAP Mixer DEC0' on"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='TX0 MODE' ADC_LP"
		cset "name='ADC1_MIXER' 1"
		cset "name='ADC1' 12"
		cset "name='TX_DEC0' 94"
	]

	DisableSequence [
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' off"
		cset "name='TX_AIF1_CAP Mixer DEC0' off"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='ADC1_MIXER' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
	}
}
