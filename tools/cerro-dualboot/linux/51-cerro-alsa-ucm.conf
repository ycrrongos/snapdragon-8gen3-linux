# WirePlumber 0.5: Cerro UCM profiles are named with verbs, not bare "HiFi".
# Wrong device.profile="HiFi" leaves Active Profile=off even when the card is up.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.alsa.use-acp = true
        api.acp.auto-profile = true
        api.acp.auto-port = true
        device.profile = "HiFi (Mic, Speaker)"
      }
    }
  }
]
